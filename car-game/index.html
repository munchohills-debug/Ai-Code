<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Turbo Track</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">
    <header>
      <div><h1>🏎️ Turbo Track</h1><p>Race the clock. Dodge traffic. Get the high score.</p></div>
      <button id="startBtn">START RACE</button>
    </header>
    <section class="hud">
      <span>Score <b id="score">0</b></span>
      <span>Speed <b id="speed">0</b> km/h</span>
      <span>Best <b id="best">0</b></span>
    </section>
    <canvas id="game" width="480" height="720"></canvas>
    <div class="controls">
      <button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
    </div>
    <p class="hint">Desktop: WASD / arrow keys · Mobile: use the controls</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
